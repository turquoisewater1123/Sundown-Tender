name: Verify and promote
on:
  push:
    branches: [dev]
permissions:
  contents: write
concurrency:
  group: promote-test
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix Novel && npm ci --prefix SillyTavern --omit=dev --no-audit
      - run: |
          node runtime/prepare-tavern.mjs
          node --check Novel/server.mjs
          node --check Novel/mongo.mjs
          node --check runtime/mobile-access.mjs
          node --check Novel/public/app.mjs
          test -s Novel/downloads/NightRead-Android.apk
      - name: Exercise the app with a disposable replica set
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=ci&directConnection=true
          NOVEL_QA_CLEANUP: '1'
          NOVEL_DATA_DIR: /tmp/nightread-ci
        run: |
          docker run --detach --name mongo -p 127.0.0.1:27017:27017 mongo:8 --replSet ci --bind_ip_all
          for i in {1..60}; do docker exec mongo mongosh --quiet --eval 'db.adminCommand({ping:1})' && break; sleep 1; done
          docker exec mongo mongosh --quiet --eval 'rs.initiate({_id:"ci",members:[{_id:0,host:"localhost:27017"}]})'
          for i in {1..60}; do docker exec mongo mongosh --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)' && break; sleep 1; done
          cp Novel/settings.example.json Novel/settings.json
          node Novel/smoke.mjs
      - name: Fast-forward test
        run: git push origin HEAD:refs/heads/test
