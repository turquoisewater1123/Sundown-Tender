<!doctype html>
<html lang="zh-CN" data-cover="{{cover}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#381a29">
  <link rel="icon" href="data:,">
  <title>登录 · 夜读</title>
  <style>
    :root { color-scheme:dark; font:16px/1.5 "PingFang SC","Microsoft YaHei",system-ui,sans-serif; color:white; background:#291d29; }
    * { box-sizing:border-box; }
    body { margin:0; }
    main {
      position:relative; isolation:isolate; min-height:100vh; min-height:100dvh;
      display:flex; flex-direction:column; justify-content:space-between;
      padding:max(26px,env(safe-area-inset-top)) max(26px,env(safe-area-inset-right)) max(clamp(28px,7svh,60px),env(safe-area-inset-bottom)) max(26px,env(safe-area-inset-left));
    }
    :root {
      --portrait:url("/novel/login-linyin.png?v=braided-portrait");
      --framing:50% 32%;
      --shade:linear-gradient(180deg,#200f1c66,transparent 18%,transparent 49%,#27121f99 72%,#160b15e6 100%);
      --side:#341925;
    }
    :root[data-cover=sapphire] {
      --portrait:url("/novel/login-sapphire.png");
      --framing:36% 18%;
      --shade:linear-gradient(180deg,#101c397a,transparent 18%,transparent 43%,#15203b9e 62%,#101a32ed 100%);
      --side:#17213a;
    }
    main::before {
      content:""; position:absolute; z-index:-1; inset:0;
      background:
        var(--shade),var(--side) var(--portrait) var(--framing) / cover no-repeat;
    }
    header { display:flex; align-items:center; gap:8px; }
    h1 { margin:0; font-size:24px; line-height:1.2; font-weight:700; letter-spacing:.03em; }
    svg { fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
    header svg { width:27px; height:27px; }
    form { display:grid; width:min(100%,400px); margin-top:clamp(70px,18svh,210px); }
    .cover-name { display:flex; align-items:baseline; gap:9px; margin:0 0 15px; font-size:clamp(27px,7vw,34px); line-height:1.2; font-weight:650; }
    .cover-name small { font-size:14px; font-weight:450; color:#f5e3e9; }
    .field { position:relative; display:flex; align-items:center; border-bottom:1px solid #ffffff89; }
    .field + .field { margin-top:8px; }
    .field:focus-within { border-color:white; }
    .field > svg { flex:none; width:19px; height:19px; margin-right:12px; }
    label { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); }
    input,button { font:inherit; color:inherit; }
    input { width:100%; min-width:0; height:50px; padding:0; background:transparent; border:0; outline:0; caret-color:#c4efff; }
    input::placeholder { color:#f2f3f7; opacity:1; }
    button { background:transparent; cursor:pointer; -webkit-tap-highlight-color:transparent; }
    button:focus-visible { outline:2px solid #c6e7ff; outline-offset:3px; }
    button:active { opacity:.75; }
    .eye { flex:none; width:44px; height:44px; display:grid; place-items:center; border:0; border-radius:50%; }
    .eye svg { width:20px; height:20px; }
    .eye[aria-pressed=false] .slash { display:none; }
    .enter { position:relative; min-height:50px; margin-top:26px; padding:0 46px; border:1px solid #ffffffd9; border-radius:26px; background:#ffffff12; font-size:16px; font-weight:600; }
    .enter svg { position:absolute; right:18px; top:50%; transform:translateY(-50%); width:20px; height:20px; }
    [role=alert] { margin:12px 0 -8px; color:#ffd4ca; font-size:14px; }
    @media (min-width:760px) and (min-aspect-ratio:1/1) {
      main { padding-inline:7vw; }
      main::before {
        background:
          linear-gradient(90deg,#15132055,transparent 23%,transparent 35%,var(--side) 65%),
          var(--side) var(--portrait) 19% 30% / auto 114% no-repeat;
      }
      form { align-self:flex-end; margin:auto 0; }
    }
    @media (max-height:560px) {
      main { padding-block:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-bottom)); }
      form { margin-top:16px; }
      .cover-name { font-size:22px; margin-bottom:6px; }
      .field + .field { margin-top:2px; }
      input { height:44px; }
      .enter { min-height:44px; margin-top:16px; }
    }
  </style>
</head>
<body>
  <main>
    <header><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M22.8 17.5A10.2 10.2 0 0 1 10.4 4.8a10.1 10.1 0 1 0 12.4 12.7Z"/><path d="m19 3 1.1 3.4L23.5 7.5l-3.4 1.1L19 12l-1.1-3.4-3.4-1.1 3.4-1.1Z"/></svg><h1>夜读</h1></header>
    <form method="post" aria-label="账号登录">
      <input type="hidden" name="cover" value="{{cover}}">
      <p class="cover-name" aria-label="封面角色，林音，18岁">林音 <small>18 岁</small></p>
      <div class="field">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c0-3.6 3.3-6.3 7.5-6.3s7.5 2.7 7.5 6.3"/></svg>
        <label for="user">用户名</label>
        <input id="user" name="username" placeholder="用户名" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </div>
      <div class="field">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="10" width="15" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 1 1 8 0v3m-4 5v2"/></svg>
        <label for="pass">密码</label>
        <input id="pass" name="password" placeholder="密码" autocomplete="current-password" type="password" required>
        <button type="button" class="eye" aria-label="显示密码" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="m3 3 18 18"/></svg>
        </button>
      </div>
      <!-- error -->
      <button type="submit" class="enter">登录<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h17m-6-6 6 6-6 6"/></svg></button>
    </form>
  </main>
  <script>
    const eye = document.querySelector('.eye');
    const password = document.querySelector('#pass');
    eye.addEventListener('click', () => {
      const reveal = password.type === 'password';
      password.type = reveal ? 'text' : 'password';
      eye.setAttribute('aria-pressed', String(reveal));
      eye.setAttribute('aria-label', reveal ? '隐藏密码' : '显示密码');
    });
  </script>
</body>
</html>
